##################################################
# 密碼雜湊（BCrypt）
##################################################
bcrypt:
  password:
    encoder:
      # BCrypt 強度（cost），每加 1 計算時間約加倍。12 在一般伺服器上約 0.2～0.5 秒，兼顧安全與登入速度。
      # 雜湊值本身會記錄強度，調整此值不影響已存在的密碼
      strength: "${APP_PW_ENC_STRENGTH:12}"
##################################################
# JWT（HMAC-SHA256 固定金鑰，由本服務簽發與驗證）
##################################################
user:
  jwt:
    token:
      signing:
        # 簽章金鑰（Base64 編碼，至少 32 bytes），必填，由環境變數提供，沒有設定時服務無法啟動。
        # 產生方式：openssl rand -base64 32
        key: "${APP_JWT_KEY}"
      expired:
        # access token 有效期間（毫秒）。預設 1800000 = 30 分鐘
        millis: "${APP_TOKEN_EXPIRED:1800000}"
    refresh:
      token:
        expired:
          # refresh token 有效期間（毫秒）。預設 86400000 = 24 小時
          millis: "${APP_REFRESH_TOKEN_EXPIRED:86400000}"
##################################################
# 登入用一次性金鑰（nonce）
##################################################
login:
  nonce:
    valid:
      period:
        in:
          # 取得公鑰後，必須在幾分鐘內完成登入，逾時需重新取得
          minutes: "${APP_NONCE_VALID_PERIOD_IN_MIN:5}"
##################################################
# 登入失敗次數限制
##################################################
  lock:
    max:
      # 連續失敗幾次後鎖定
      failures: "5"
    duration:
      # 鎖定多久（秒）。預設 900 = 15 分鐘
      seconds: "${APP_LOGIN_LOCK_SECONDS:900}"
